<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img" aria-labelledby="title">
  <title id="title">Windmill on green hills with a flag and two clouds</title>
  <style>
    .sky { fill: #bde0fe; }
    .hill-far { fill: #95d5b2; }
    .hill-near { fill: #52b788; }
    .tower { fill: #f1e3d3; }
    .roof { fill: #9c6644; }
    .door { fill: #7f5539; }
    .blade { fill: #ffffff; stroke: #7f5539; stroke-width: 3; }
    .hub { fill: #7f5539; }
    .pole { stroke: #6c757d; stroke-width: 4; stroke-linecap: round; }
    .flag { fill: #e63946; }
    .cloud { fill: #ffffff; }
  </style>
  <g id="background">
    <rect class="sky" x="0" y="0" width="480" height="320"/>
  </g>
  <g id="clouds">
    <g id="cloud-left">
      <rect class="cloud" x="40" y="60" width="90" height="28" rx="14"/>
      <circle class="cloud" cx="72" cy="60" r="18"/>
      <circle class="cloud" cx="100" cy="56" r="22"/>
    </g>
    <g id="cloud-right">
      <rect class="cloud" x="200" y="36" width="70" height="22" rx="11"/>
      <circle class="cloud" cx="225" cy="36" r="14"/>
      <circle class="cloud" cx="248" cy="32" r="17"/>
    </g>
  </g>
  <g id="hills">
    <path id="hill-far" class="hill-far" d="M0 230 Q120 170 240 215 T480 200 V320 H0 Z"/>
    <path id="hill-near" class="hill-near" d="M0 265 Q160 225 300 255 T480 250 V320 H0 Z"/>
  </g>
  <g id="flag-group">
    <line id="flag-pole" class="pole" x1="80" y1="250" x2="80" y2="170"/>
    <polygon id="flag" class="flag" points="82,172 122,182 82,194"/>
  </g>
  <g id="windmill">
    <polygon id="tower" class="tower" points="296,262 344,262 334,130 306,130"/>
    <polygon id="roof" class="roof" points="300,132 340,132 320,104"/>
    <rect id="door" class="door" x="312" y="236" width="16" height="26" rx="8"/>
    <g id="blades">
      <rect id="blade-1" class="blade" x="314" y="34" width="12" height="80" rx="3"/>
      <rect id="blade-2" class="blade" x="314" y="34" width="12" height="80" rx="3" transform="rotate(120 320 120)"/>
      <rect id="blade-3" class="blade" x="314" y="34" width="12" height="80" rx="3" transform="rotate(240 320 120)"/>
    </g>
    <circle id="hub" class="hub" cx="320" cy="120" r="7"/>
  </g>
</svg>
